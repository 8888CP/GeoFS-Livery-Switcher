name: Purge jsDelivr cache

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Purge every texture URL
        run: |
          node << 'EOF'
          const fs = require('fs');
          const https = require('https');

          const data = JSON.parse(fs.readFileSync('./livery.json', 'utf8'));
          const urls = new Set();
          data.forEach(ac => (ac.liveries || []).forEach(lv => {
            if (lv.texture && lv.texture.startsWith('https://cdn.jsdelivr.net/'))
              urls.add(lv.texture);
          }));

          if (!urls.size) {
            console.log('No jsDelivr URLs found.');
            process.exit(0);
          }

          async function purge(url) {
            const purgeUrl = url.replace('cdn.jsdelivr.net', 'purge.jsdelivr.net');
            return new Promise(resolve => {
              https.get(purgeUrl, res => {
                let body = '';
                res.on('data', c => body += c);
                res.on('end', () => {
                  console.log(`✓ ${url}`);
                  resolve();
                });
              }).on('error', e => {
                console.log(`✗ ${url} - ${e.message}`);
                resolve();
              });
            });
          }

          (async () => {
            for (const u of urls) await purge(u);
            console.log(`\nPurged ${urls.size} URL(s).`);
          })();
          EOF
