name: Notify Discord on Livery Update

on:
  push:
    paths:
      - 'livery.json'
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          node << 'EOF'
          const fs = require('fs');

          async function main() {
            const data = JSON.parse(fs.readFileSync('./livery.json', 'utf8'));

            let totalLiveries = 0;
            const aircraftList = [];

            data.forEach(ac => {
              const count = (ac.liveries || []).length;
              totalLiveries += count;
              if (count > 0) {
                aircraftList.push(`${ac.aircraft} (${count})`);
              }
            });

            const commitMsg = process.env.GITHUB_EVENT_HEAD_COMMIT_MESSAGE || 'Manual update';
            const author = process.env.GITHUB_ACTOR || 'unknown';

            const content = [
              '🛫 **GeoFS Livery Switcher — Database Updated**',
              '',
              `**Author**: ${author}`,
              `**Commit**: ${commitMsg}`,
              `**Total liveries**: ${totalLiveries}`,
              `**Aircraft covered**: ${aircraftList.join(' | ')}`,
              '',
              `[View repository](https://github.com/${process.env.GITHUB_REPOSITORY})`
            ].join('\n');

            await fetch(process.env.DISCORD_WEBHOOK, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content })
            });

            console.log('✅ Discord notified');
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF
