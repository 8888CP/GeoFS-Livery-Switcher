name: Sync livery.json with jsDelivr URLs

on:
  push:
    paths:
      - 'liveries/**'
      - 'livery.json'
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install sharp

      - name: Lossless re-encode images (no quality loss)
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const ROOT = './liveries';
          if (!fs.existsSync(ROOT)) {
            console.log('No liveries/ folder, skipping.');
            process.exit(0);
          }

          function walk(dir) {
            const out = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...walk(full));
              else out.push(full);
            }
            return out;
          }

          (async () => {
            const files = walk(ROOT).filter(f => /\.(png|jpe?g)$/i.test(f));
            for (const file of files) {
              const ext = path.extname(file).toLowerCase();
              const before = fs.statSync(file).size;
              const img = sharp(file);

              // 真正的无损：只重新编码，不改任何像素值
              const buf = ext === '.png'
                ? await img.png({
                    compressionLevel: 9,      // zlib 最高等级
                    adaptiveFiltering: true,  // 自动选最优滤波
                    palette: false,           // 禁用调色板（那才是有损）
                    colors: 0                 // 不限制颜色数
                  }).toBuffer()
                : await img.jpeg({
                    quality: 100,             // 最高质量
                    chromaSubsampling: '4:4:4', // 不丢弃色度信息
                    mozjpeg: true             // 只优化编码，不改像素
                  }).toBuffer();

              // 只在真的变小的时候才写回
              if (buf.length < before) {
                fs.writeFileSync(file, buf);
                console.log(`✓ ${path.basename(file)}: ${(before/1024).toFixed(1)} KB -> ${(buf.length/1024).toFixed(1)} KB`);
              } else {
                console.log(`- ${path.basename(file)}: ${(before/1024).toFixed(1)} KB (already optimal)`);
              }
            }
          })();
          EOF

      - name: Rewrite texture URLs to jsDelivr
        run: |
          node << 'EOF'
          const fs = require('fs');

          const USER   = '8888CP';
          const REPO   = 'GeoFS-Livery-Switcher';
          const BRANCH = 'main';

          const JSD_BASE = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@${BRANCH}/`;
          const RAW_BASE = `https://raw.githubusercontent.com/${USER}/${REPO}/refs/heads/${BRANCH}/`;

          const data = JSON.parse(fs.readFileSync('./livery.json', 'utf8'));
          let changed = 0;

          function toJsDelivr(url) {
            if (!url) return url;
            if (url.startsWith('https://cdn.jsdelivr.net/')) return url;
            if (url.startsWith(RAW_BASE)) return JSD_BASE + url.slice(RAW_BASE.length);
            if (url.startsWith('liveries/')) return JSD_BASE + url;
            return url;
          }

          data.forEach(ac => {
            (ac.liveries || []).forEach(lv => {
              if (lv.texture) {
                const next = toJsDelivr(lv.texture);
                if (next !== lv.texture) {
                  console.log(`texture: ${lv.texture}\n     ->  ${next}`);
                  lv.texture = next;
                  changed++;
                }
              }
            });
          });

          if (changed) {
            fs.writeFileSync('./livery.json', JSON.stringify(data, null, 2));
            console.log(`\nUpdated ${changed} URL(s).`);
          } else {
            console.log('All URLs already use jsDelivr.');
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: sync jsDelivr URLs (lossless re-encode)"
          git push
